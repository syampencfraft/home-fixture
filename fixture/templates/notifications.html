{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <h2 class="mb-4 text-white fw-bold">Notifications</h2>
    <div class="list-group">
        {% for note in notifications %}
        <div
            class="list-group-item list-group-item-action bg-black bg-opacity-40 border border-white border-opacity-10 mb-2 rounded-3 text-white shadow-sm {% if not note.is_read %}border-start-4{% endif %}">
            <div class="d-flex w-100 justify-content-between align-items-center">
                <h6 class="mb-1 fw-bold">{{ note.message }}</h6>
                <small class="text-white opacity-50">{{ note.created_at|timesince }} ago</small>
            </div>
        </div>
        {% empty %}
        <div
            class="list-group-item bg-black bg-opacity-40 border border-white border-opacity-10 text-center py-5 text-muted rounded-3 shadow-sm">
            <i class="bi bi-bell-slash fs-1 d-block mb-3 opacity-25"></i>
            <span class="text-white opacity-50">You have no notifications.</span>
        </div>
        {% endfor %}
    </div>
</div>

<style>
    .border-start-4 {
        border-left: 4px solid #ffffff !important;
    }
</style>
{% endblock %}
